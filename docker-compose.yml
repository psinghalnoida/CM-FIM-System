services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmfim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmfim}
      POSTGRES_DB: ${POSTGRES_DB:-cmfim}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmfim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-cmfim}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-cmfim12345}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the app's bucket on first startup so nothing has
  # to click through the MinIO console before the app can store documents.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-cmfim} ${S3_SECRET_ACCESS_KEY:-cmfim12345} &&
      mc mb --ignore-existing local/${S3_BUCKET:-cm-fim-documents}
      "

  app:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host-facing defaults from .env with in-network addresses —
      # containers reach Postgres/Redis by service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmfim}:${POSTGRES_PASSWORD:-cmfim}@postgres:5432/${POSTGRES_DB:-cmfim}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmfim}:${POSTGRES_PASSWORD:-cmfim}@postgres:5432/${POSTGRES_DB:-cmfim}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
